spring.application.name=api-gateway

# Puerto del borde. contracts/api/openapi.yaml documenta 8080 como valor por omision.
server.port=${GATEWAY_PORT:8080}

# Ubicacion interna de Order Service. El cliente nunca la conoce (HU-401, ADR-07).
# En Compose sera http://order-service:8081; en local, el puerto por defecto del servicio.
foodflow.gateway.order-service-url=${ORDER_SERVICE_URL:http://localhost:8081}

# Timeouts del cliente HTTP con el que el gateway llama a los servicios. Spring Cloud Gateway MVC
# usa la configuracion compartida de Spring Boot, que no trae valores por omision: sin ellos, un
# servicio que acepta la conexion y no responde deja al cliente colgado. Al vencer, el gateway
# responde 503 DEPENDENCY_UNAVAILABLE (DependencyUnavailable).
spring.http.clients.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${GATEWAY_READ_TIMEOUT:10s}
