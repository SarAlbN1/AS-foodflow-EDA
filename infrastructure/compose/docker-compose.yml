# ============================================================================
#  FoodFlow EDA — entorno local (HU-002, HU-004, HU-306, HU-607)
# ============================================================================
#  Contiene todo el prototipo:
#    - Apache Kafka en modo KRaft (un nodo que hace de broker y de controller).
#    - Tres PostgreSQL independientes, una por servicio, con credenciales propias.
#    - Los tópicos y sus DLQ, creados por `kafka-init` (HU-004).
#    - El proveedor de notificaciones simulado `notification-provider` (HU-306).
#    - Los tres servicios, el API Gateway y el frontend (HU-607).
#
#  Reglas que aplican:
#    2. Cada servicio es el único propietario de su base.
#    3. Ninguna base publica ni consume eventos; Kafka nunca escribe en PostgreSQL.
#
#  Uso habitual (desde la raíz del repositorio): scripts/up.sh, scripts/down.sh y
#  scripts/smoke-test.sh. Equivalente manual, con `.env` ya creado:
#    docker compose --env-file .env -f infrastructure/compose/docker-compose.yml up -d
#    docker compose --env-file .env -f infrastructure/compose/docker-compose.yml ps
#    docker compose --env-file .env -f infrastructure/compose/docker-compose.yml down
#
#  Detalle y solución de problemas: infrastructure/compose/README.md
# ============================================================================

name: foodflow-eda

services:

  # --------------------------------------------------------------------------
  #  Apache Kafka — modo KRaft. Kafka 4.x no usa ZooKeeper.
  # --------------------------------------------------------------------------
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: foodflow-kafka
    ports:
      # Escucha externa, solo para herramientas ejecutadas en el host.
      - "${KAFKA_HOST_PORT}:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Un solo nodo: todo con factor de replicación 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos los declara la HU-004 de forma explícita: nada de creación implícita.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # El broker está listo cuando responde a una consulta de versiones de API.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Creación de tópicos (HU-004). Contenedor de un solo uso: espera a que Kafka
  #  esté healthy, crea los tópicos y sus DLQ de forma idempotente y termina.
  #  Declaración de tópicos: infrastructure/kafka/scripts/create-topics.sh
  # --------------------------------------------------------------------------
  kafka-init:
    image: ${KAFKA_IMAGE}
    container_name: foodflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    volumes:
      - ../kafka/scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    networks: [foodflow]
    restart: "no"

  # --------------------------------------------------------------------------
  #  Order DB — la usa ÚNICAMENTE order-service.
  #  URL para order-service: jdbc:postgresql://order-db:5432/${ORDER_DB_NAME}
  # --------------------------------------------------------------------------
  order-db:
    image: ${POSTGRES_IMAGE}
    container_name: foodflow-order-db
    ports:
      - "${ORDER_DB_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      # postgres:18+ guarda los datos en un subdirectorio por versión mayor, así que el
      # montaje va en /var/lib/postgresql y no en /var/lib/postgresql/data: con el montaje
      # en .../data el contenedor aborta el arranque.
      - order-db-data:/var/lib/postgresql
      # El esquema lo crea order-service con Flyway al arrancar (HU-010); ya no se monta
      # infrastructure/postgres/order-db en docker-entrypoint-initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Payment DB — la usa ÚNICAMENTE payment-service.
  #  URL para payment-service: jdbc:postgresql://payment-db:5432/${PAYMENT_DB_NAME}
  # --------------------------------------------------------------------------
  payment-db:
    image: ${POSTGRES_IMAGE}
    container_name: foodflow-payment-db
    ports:
      - "${PAYMENT_DB_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment-db-data:/var/lib/postgresql
      # El esquema lo crea payment-service con Flyway al arrancar (HU-010); ya no se monta
      # infrastructure/postgres/payment-db en docker-entrypoint-initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Notification DB — la usa ÚNICAMENTE notification-service.
  #  URL para notification-service: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME}
  # --------------------------------------------------------------------------
  notification-db:
    image: ${POSTGRES_IMAGE}
    container_name: foodflow-notification-db
    ports:
      - "${NOTIFICATION_DB_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-db-data:/var/lib/postgresql
      # El esquema lo crea notification-service con Flyway al arrancar (HU-010); ya no se monta
      # infrastructure/postgres/notification-db en docker-entrypoint-initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Proveedor de notificaciones simulado (HU-306). Solo desarrollo, demo y
  #  pruebas. Lo invoca ÚNICAMENTE notification-service, con la URL de
  #  NOTIFICATION_PROVIDER_URL. Modos por destino: *@fail.test, *@flaky.test,
  #  *@slow.test (docs/wiki/03-contratos/proveedor-notificaciones.md).
  # --------------------------------------------------------------------------
  notification-provider:
    build:
      context: ../../mocks/notification-provider
    image: foodflow/notification-provider:0.0.1
    container_name: foodflow-notification-provider
    ports:
      # Solo para probarlo desde el host (curl); los servicios usan la red interna.
      - "${NOTIFICATION_PROVIDER_HOST_PORT:-8090}:8080"
    environment:
      MOCK_SLOW_DELAY: ${MOCK_SLOW_DELAY:-5s}
      MOCK_FLAKY_FAILURES: ${MOCK_FLAKY_FAILURES:-2}
    networks: [foodflow]
    restart: unless-stopped

  # ==========================================================================
  #  Servicios, gateway y frontend (HU-607). Se construyen desde el código del
  #  repositorio con la receta de infrastructure/docker/. Solo el gateway y el
  #  frontend publican puertos en el host: el cliente nunca ve a los servicios.
  #  Dentro de la red cada uno recibe la URL interna de SU base y kafka:9092.
  # ==========================================================================

  # --------------------------------------------------------------------------
  #  Order Service — único propietario de Order DB. Publica en orders.events.
  # --------------------------------------------------------------------------
  order-service:
    build:
      context: ../../services/order-service
      dockerfile: ../../infrastructure/docker/spring-boot-service.Dockerfile
    image: foodflow/order-service:0.0.1
    container_name: foodflow-order-service
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ORDER_SERVICE_PORT: 8081
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/${ORDER_DB_NAME}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?falta KAFKA_BOOTSTRAP_SERVERS en .env; compara con .env.example}
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:?falta KAFKA_RETRY_MAX_ATTEMPTS en .env; compara con .env.example}
      KAFKA_RETRY_INITIAL_INTERVAL: ${KAFKA_RETRY_INITIAL_INTERVAL:?falta KAFKA_RETRY_INITIAL_INTERVAL en .env; compara con .env.example}
      KAFKA_RETRY_MULTIPLIER: ${KAFKA_RETRY_MULTIPLIER:?falta KAFKA_RETRY_MULTIPLIER en .env; compara con .env.example}
      ORDERS_TOPIC: ${ORDERS_TOPIC:?falta ORDERS_TOPIC en .env; compara con .env.example}
      # Consumo del resultado del pago (HU-104).
      PAYMENTS_TOPIC: ${PAYMENTS_TOPIC:?falta PAYMENTS_TOPIC en .env; compara con .env.example}
      ORDER_PAYMENTS_CONSUMER_GROUP: ${ORDER_PAYMENTS_CONSUMER_GROUP:?falta ORDER_PAYMENTS_CONSUMER_GROUP en .env; compara con .env.example}
    healthcheck:
      # La imagen no trae curl: bash abre el socket y pide readiness (200 = listo).
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/8081 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Payment Service — único propietario de Payment DB. Consume orders.events y
  #  publica en payments.events. No expone API de negocio.
  # --------------------------------------------------------------------------
  payment-service:
    build:
      context: ../../services/payment-service
      dockerfile: ../../infrastructure/docker/spring-boot-service.Dockerfile
    image: foodflow/payment-service:0.0.1
    container_name: foodflow-payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      PAYMENT_SERVICE_PORT: 8082
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/${PAYMENT_DB_NAME}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?falta KAFKA_BOOTSTRAP_SERVERS en .env; compara con .env.example}
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:?falta KAFKA_RETRY_MAX_ATTEMPTS en .env; compara con .env.example}
      KAFKA_RETRY_INITIAL_INTERVAL: ${KAFKA_RETRY_INITIAL_INTERVAL:?falta KAFKA_RETRY_INITIAL_INTERVAL en .env; compara con .env.example}
      KAFKA_RETRY_MULTIPLIER: ${KAFKA_RETRY_MULTIPLIER:?falta KAFKA_RETRY_MULTIPLIER en .env; compara con .env.example}
      ORDERS_TOPIC: ${ORDERS_TOPIC:?falta ORDERS_TOPIC en .env; compara con .env.example}
      PAYMENTS_TOPIC: ${PAYMENTS_TOPIC:?falta PAYMENTS_TOPIC en .env; compara con .env.example}
      PAYMENT_ORDERS_CONSUMER_GROUP: ${PAYMENT_ORDERS_CONSUMER_GROUP:?falta PAYMENT_ORDERS_CONSUMER_GROUP en .env; compara con .env.example}
    healthcheck:
      # La imagen no trae curl: bash abre el socket y pide readiness (200 = listo).
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/8082 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Notification Service — único propietario de Notification DB y único que
  #  llama al proveedor (regla 7). Recibe ya la URL de su base y la del mock
  #  para cuando EP-03 las use; mientras tanto solo expone su health check.
  # --------------------------------------------------------------------------
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: ../../infrastructure/docker/spring-boot-service.Dockerfile
    image: foodflow/notification-service:0.0.1
    container_name: foodflow-notification-service
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      notification-provider:
        condition: service_started
    environment:
      # 8083 sigue la serie de puertos locales; el gateway enruta allí (HU-402). Misma
      # variable que order (ORDER_SERVICE_PORT) y payment (PAYMENT_SERVICE_PORT).
      NOTIFICATION_SERVICE_PORT: 8083
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?falta KAFKA_BOOTSTRAP_SERVERS en .env; compara con .env.example}
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:?falta KAFKA_RETRY_MAX_ATTEMPTS en .env; compara con .env.example}
      KAFKA_RETRY_INITIAL_INTERVAL: ${KAFKA_RETRY_INITIAL_INTERVAL:?falta KAFKA_RETRY_INITIAL_INTERVAL en .env; compara con .env.example}
      KAFKA_RETRY_MULTIPLIER: ${KAFKA_RETRY_MULTIPLIER:?falta KAFKA_RETRY_MULTIPLIER en .env; compara con .env.example}
      PAYMENTS_TOPIC: ${PAYMENTS_TOPIC:?falta PAYMENTS_TOPIC en .env; compara con .env.example}
      NOTIFICATION_PAYMENTS_CONSUMER_GROUP: ${NOTIFICATION_PAYMENTS_CONSUMER_GROUP:?falta NOTIFICATION_PAYMENTS_CONSUMER_GROUP en .env; compara con .env.example}
      # Crítica desde HU-302: es la baseUrl del cliente del proveedor. Vacía anularía el valor
      # por omisión de Spring y todos los envíos fallarían sin una causa visible.
      NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:?falta NOTIFICATION_PROVIDER_URL en .env; compara con .env.example}
    healthcheck:
      # La imagen no trae curl: bash abre el socket y pide readiness (200 = listo).
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/8083 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  API Gateway — el único punto de entrada del cliente (HU-401). Enruta por
  #  la red interna; no tiene base ni Kafka.
  # --------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../../gateway/api-gateway
      dockerfile: ../../infrastructure/docker/spring-boot-service.Dockerfile
    image: foodflow/api-gateway:0.0.1
    container_name: foodflow-api-gateway
    depends_on:
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      # El frontend compila http://localhost:8080 como URL base (core/api-config.ts).
      - "${GATEWAY_PORT:?falta GATEWAY_PORT en .env; compara con .env.example}:8080"
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8082
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS}
      GATEWAY_CONNECT_TIMEOUT: ${GATEWAY_CONNECT_TIMEOUT}
      GATEWAY_READ_TIMEOUT: ${GATEWAY_READ_TIMEOUT}
    healthcheck:
      # La imagen no trae curl: bash abre el socket y pide readiness (200 = listo).
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [foodflow]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  Frontend Angular servido por Nginx. El navegador solo habla con el
  #  gateway (regla 1); 4200 es el origen que GATEWAY_CORS_ALLOWED_ORIGINS autoriza.
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend/foodflow-web
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
    image: foodflow/frontend:0.0.1
    container_name: foodflow-frontend
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "4200:80"
    networks: [foodflow]
    restart: unless-stopped

networks:
  foodflow:
    name: foodflow-eda
    driver: bridge

volumes:
  order-db-data:
    name: foodflow-order-db-data
  payment-db-data:
    name: foodflow-payment-db-data
  notification-db-data:
    name: foodflow-notification-db-data
