spring.application.name=notification-provider
server.port=8080
# Errores de validación en formato Problem Details (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Modos de fallo (docs/wiki/03-contratos/proveedor-notificaciones.md).
# slow.test debe superar el timeout de lectura del cliente (3 s).
mock.slow-delay=${MOCK_SLOW_DELAY:5s}
mock.flaky-failures=${MOCK_FLAKY_FAILURES:2}
