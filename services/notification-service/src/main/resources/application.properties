spring.application.name=notification-service

# ---------------------------------------------------------------------------
#  Health checks (HU-604). Contrato: docs/wiki/03-contratos/api-rest.md
# ---------------------------------------------------------------------------
# Solo se publica health: ningún otro endpoint de Actuator queda expuesto.
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only

# Se muestra el estado por componente (qué dependencia está caída) pero nunca
# su detalle, que es donde Actuator incluiría URL, usuario o versión (CA-3).
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Separa "la aplicación arrancó" (liveness) de "sus dependencias esenciales
# responden" (readiness).
#
# OJO al añadir una dependencia esencial a este servicio: el grupo readiness
# contiene SOLO readinessState por omisión, así que un contribuyente nuevo NO
# entra solo. La HU que añada el starter de JPA debe añadir además:
#
#     management.endpoint.health.group.readiness.include=readinessState,db
#
# Sin esa línea, readiness responde 200 con la base caída. Y con ella en un
# servicio que todavía no tiene base, el arranque falla con
# "Health contributor 'db' does not exist": por eso va en la HU que trae la base,
# no aquí.
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
#  Puerto HTTP local (HU-301). El API Gateway (HU-402) enruta hacia aqui la
#  consulta de notificaciones. Order usa 8081 y Payment 8082.
# ---------------------------------------------------------------------------
server.port=${NOTIFICATION_SERVICE_PORT:8083}

# ---------------------------------------------------------------------------
#  Notification DB. Regla arquitectonica 2: notification-service recibe UNICAMENTE
#  la URL de su propia base. Variables documentadas en .env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:${NOTIFICATION_DB_HOST_PORT:5435}/${NOTIFICATION_DB_NAME:notificationdb}}
spring.datasource.username=${NOTIFICATION_DB_USER:notification_user}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:}

# El esquema lo crean los scripts de infrastructure/postgres/notification-db/ (HU-002):
# Hibernate solo valida que el mapeo coincida (docs/wiki/03-contratos/persistencia.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Notification DB es dependencia esencial, asi que entra en readiness (HU-604, criterio 2).
# El grupo contiene solo readinessState por omision: sin esta linea el servicio anunciaria
# que puede atender trafico con su base caida.
management.endpoint.health.group.readiness.include=readinessState,db

# ---------------------------------------------------------------------------
#  Consumo de payments.events (HU-301). Contrato: docs/wiki/03-contratos/eventos.md
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Grupo propio, con el formato <servicio>.<topico> del contrato. Order Service consume el
# mismo topico en un grupo distinto: los dos reciben el resultado de forma independiente.
spring.kafka.consumer.group-id=${NOTIFICATION_PAYMENTS_CONSUMER_GROUP:notification-service.payments}
spring.kafka.consumer.auto-offset-reset=earliest

# El offset se confirma a mano y solo despues del commit local (ADR-09).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Tolerancia a mensajes corruptos: un valor ilegible no tumba al consumidor.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

# Los topicos se leen de configuracion, nunca como literales dispersos (regla 11).
foodflow.kafka.payments-topic=${PAYMENTS_TOPIC:payments.events}

# ---------------------------------------------------------------------------
#  Proveedor externo de notificaciones (HU-302).
#  Contrato: docs/wiki/03-contratos/proveedor-notificaciones.md
#  El proveedor simulado de HU-306 vive en mocks/notification-provider.
# ---------------------------------------------------------------------------
# Dentro de la red de Compose es http://notification-provider:8080; desde el host,
# el puerto publicado (NOTIFICATION_PROVIDER_HOST_PORT, 8090 por omision).
foodflow.provider.url=${NOTIFICATION_PROVIDER_URL:http://localhost:8090}

# Timeouts explicitos (criterio 3). Sin ellos el cliente esperaria indefinidamente y
# bloquearia el hilo del consumidor de Kafka, deteniendo el consumo del resto de eventos.
foodflow.provider.connect-timeout=${NOTIFICATION_PROVIDER_CONNECT_TIMEOUT:2s}
foodflow.provider.read-timeout=${NOTIFICATION_PROVIDER_READ_TIMEOUT:3s}

# Reintentos finitos y configurables (criterio 6): 3 intentos con espera de 500 ms que se
# duplica, o sea esperas de 500 ms y 1 s. Sin Circuit Breaker (lista de no implementar).
foodflow.provider.max-attempts=${NOTIFICATION_PROVIDER_MAX_ATTEMPTS:3}
foodflow.provider.initial-backoff=${NOTIFICATION_PROVIDER_INITIAL_BACKOFF:500ms}
foodflow.provider.backoff-multiplier=${NOTIFICATION_PROVIDER_BACKOFF_MULTIPLIER:2}
