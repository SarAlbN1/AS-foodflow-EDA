spring.application.name=notification-service

# ---------------------------------------------------------------------------
#  Health checks (HU-604). Contrato: docs/wiki/03-contratos/api-rest.md
# ---------------------------------------------------------------------------
# Solo se publica health: ningún otro endpoint de Actuator queda expuesto.
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only

# Se muestra el estado por componente (qué dependencia está caída) pero nunca
# su detalle, que es donde Actuator incluiría URL, usuario o versión (CA-3).
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Separa "la aplicación arrancó" (liveness) de "sus dependencias esenciales
# responden" (readiness).
#
# OJO al añadir una dependencia esencial a este servicio: el grupo readiness
# contiene SOLO readinessState por omisión, así que un contribuyente nuevo NO
# entra solo. La HU que añada el starter de JPA debe añadir además:
#
#     management.endpoint.health.group.readiness.include=readinessState,db
#
# Sin esa línea, readiness responde 200 con la base caída. Y con ella en un
# servicio que todavía no tiene base, el arranque falla con
# "Health contributor 'db' does not exist": por eso va en la HU que trae la base,
# no aquí.
management.endpoint.health.probes.enabled=true
