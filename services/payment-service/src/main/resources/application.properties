spring.application.name=payment-service
logging.structured.format.console=logstash
logging.structured.json.rename.[@timestamp]=timestamp
logging.structured.json.add.service=${spring.application.name}

# ---------------------------------------------------------------------------
#  Health checks (HU-604). Contrato: docs/wiki/03-contratos/api-rest.md
# ---------------------------------------------------------------------------
# Solo se publica health: ningún otro endpoint de Actuator queda expuesto.
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only

# Se muestra el estado por componente (qué dependencia está caída) pero nunca
# su detalle, que es donde Actuator incluiría URL, usuario o versión (CA-3).
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Separa "la aplicación arrancó" (liveness) de "sus dependencias esenciales
# responden" (readiness).
#
# OJO al añadir una dependencia esencial a este servicio: el grupo readiness
# contiene SOLO readinessState por omisión, así que un contribuyente nuevo NO
# entra solo. La HU que añada el starter de JPA debe añadir además:
#
#     management.endpoint.health.group.readiness.include=readinessState,db
#
# Sin esa línea, readiness responde 200 con la base caída. Y con ella en un
# servicio que todavía no tiene base, el arranque falla con
# "Health contributor 'db' does not exist": por eso va en la HU que trae la base,
# no aquí.
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
#  Puerto HTTP local (HU-201). Payment Service no publica API de negocio: el
#  puerto solo sirve para el health check. No hay endpoint de consulta de pagos
#  (docs/wiki/03-contratos/api-rest.md).
# ---------------------------------------------------------------------------
server.port=${PAYMENT_SERVICE_PORT:8082}

# ---------------------------------------------------------------------------
#  Consumo de orders.events (HU-201). Contrato: docs/wiki/03-contratos/eventos.md
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Grupo propio del servicio, con el formato <servicio>.<topico> del contrato.
# Order y Notification consumen payments.events en grupos distintos.
spring.kafka.consumer.group-id=${PAYMENT_ORDERS_CONSUMER_GROUP:payment-service.orders}
spring.kafka.consumer.auto-offset-reset=earliest

# El offset se confirma a mano y solo despues del efecto local (ADR-09).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Tolerancia a mensajes corruptos: un valor ilegible no tumba al consumidor
# (docs/wiki/04-implementacion/convenciones.md). El paso de JSON a objeto ocurre
# en el consumidor, donde el fallo se clasifica como no recuperable.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

# Los topicos se leen de configuracion, nunca como literales dispersos (regla 11).
foodflow.kafka.orders-topic=${ORDERS_TOPIC:orders.events}
foodflow.kafka.payments-topic=${PAYMENTS_TOPIC:payments.events}

# ---------------------------------------------------------------------------
#  Publicacion del resultado del pago (HU-203).
# ---------------------------------------------------------------------------
# acks=all e idempotencia: el lider espera a las replicas sincronizadas y un reintento
# interno del productor no duplica el registro en el topico.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# La publicacion ocurre despues del commit, asi que un broker lento no debe dejar colgado el
# procesamiento del evento de entrada.
spring.kafka.producer.properties.delivery.timeout.ms=${PAYMENTS_PUBLISH_TIMEOUT_MS:10000}
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000

# ---------------------------------------------------------------------------
#  Payment DB (HU-202). Regla arquitectonica 2: payment-service recibe UNICAMENTE
#  la URL de su propia base. Variables documentadas en .env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:${PAYMENT_DB_HOST_PORT:5434}/${PAYMENT_DB_NAME:paymentdb}}
spring.datasource.username=${PAYMENT_DB_USER:payment_user}
spring.datasource.password=${PAYMENT_DB_PASSWORD:}

# El esquema lo crean los scripts de infrastructure/postgres/payment-db/ (HU-002):
# Hibernate solo valida que el mapeo coincida (docs/wiki/03-contratos/persistencia.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Payment DB es dependencia esencial, asi que entra en readiness (HU-604, criterio 2).
# El grupo contiene solo readinessState por omision: sin esta linea el servicio anunciaria
# que puede atender trafico con su base caida. Comprobado en HealthEndpointTest.
management.endpoint.health.group.readiness.include=readinessState,db

# ---------------------------------------------------------------------------
#  Reintentos y DLQ del consumidor (HU-602). Politica de convenciones.md:
#  3 intentos, espera inicial 1 s, multiplicador 2. Un evento no procesable no
#  se reintenta: va directo a <topico>.dlq.
# ---------------------------------------------------------------------------
foodflow.kafka.retry.max-attempts=${KAFKA_RETRY_MAX_ATTEMPTS:3}
foodflow.kafka.retry.initial-interval=${KAFKA_RETRY_INITIAL_INTERVAL:1s}
foodflow.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2}

# ---------------------------------------------------------------------------
#  Migraciones de esquema (HU-010). Flyway aplica db/migration al arrancar y
#  Hibernate solo valida (ddl-auto=validate). baseline-on-migrate deja como V1
#  una base que ya tenia el esquema creado por el antiguo 01-schema.sql de
#  Compose, sin volver a crearlo.
# ---------------------------------------------------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
