spring.application.name=payment-service

# ---------------------------------------------------------------------------
#  Health checks (HU-604). Contrato: docs/wiki/03-contratos/api-rest.md
# ---------------------------------------------------------------------------
# Solo se publica health: ningún otro endpoint de Actuator queda expuesto.
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only

# Se muestra el estado por componente (qué dependencia está caída) pero nunca
# su detalle, que es donde Actuator incluiría URL, usuario o versión (CA-3).
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Separa "la aplicación arrancó" (liveness) de "sus dependencias esenciales
# responden" (readiness). El contribuyente de base de datos se registra solo
# cuando la HU correspondiente añada el starter de JPA.
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
#  Puerto HTTP local (HU-201). Payment Service no publica API de negocio: el
#  puerto solo sirve para el health check. No hay endpoint de consulta de pagos
#  (docs/wiki/03-contratos/api-rest.md).
# ---------------------------------------------------------------------------
server.port=${PAYMENT_SERVICE_PORT:8082}

# ---------------------------------------------------------------------------
#  Consumo de orders.events (HU-201). Contrato: docs/wiki/03-contratos/eventos.md
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Grupo propio del servicio, con el formato <servicio>.<topico> del contrato.
# Order y Notification consumen payments.events en grupos distintos.
spring.kafka.consumer.group-id=${PAYMENT_ORDERS_CONSUMER_GROUP:payment-service.orders}
spring.kafka.consumer.auto-offset-reset=earliest

# El offset se confirma a mano y solo despues del efecto local (ADR-09).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Tolerancia a mensajes corruptos: un valor ilegible no tumba al consumidor
# (docs/wiki/04-implementacion/convenciones.md). El paso de JSON a objeto ocurre
# en el consumidor, donde el fallo se clasifica como no recuperable.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

# Los topicos se leen de configuracion, nunca como literales dispersos (regla 11).
foodflow.kafka.orders-topic=${ORDERS_TOPIC:orders.events}
