# Solo pruebas. Spring Boot combina este archivo con src/main/resources/application.properties
# (classpath:/config/ tiene prioridad clave a clave), asi que solo cambia lo que se declara aqui.

# HU-010: sin base de datos, Flyway no puede migrar al arrancar y tumbaria los contextos de prueba
# que no usan la base (Hikari solo conecta cuando se usa). InfraestructuraEfimera lo activa cuando
# hay una base: la de Compose (variable *_DB_URL) o la efimera de -Ptestcontainers.
spring.flyway.enabled=false
