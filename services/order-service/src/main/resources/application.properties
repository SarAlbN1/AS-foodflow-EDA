spring.application.name=order-service

# Puerto HTTP local del servicio. El API Gateway (HU-401) enruta hacia aqui.
server.port=${ORDER_SERVICE_PORT:8081}

# Order DB. Regla arquitectonica 3: order-service recibe UNICAMENTE la URL de su propia base.
# Variables documentadas en .env.example.
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:${ORDER_DB_HOST_PORT:5433}/${ORDER_DB_NAME:orderdb}}
spring.datasource.username=${ORDER_DB_USER:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:}

# El esquema lo crean los scripts de infrastructure/postgres/order-db/ (HU-002):
# Hibernate solo valida que el mapeo coincida (docs/wiki/03-contratos/persistencia.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Problem Details (RFC 9457) para los errores que no maneja el ControllerAdvice.
spring.mvc.problemdetails.enabled=true
