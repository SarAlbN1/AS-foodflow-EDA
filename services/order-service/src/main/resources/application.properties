spring.application.name=order-service

# Puerto HTTP local del servicio. El API Gateway (HU-401) enruta hacia aqui.
server.port=${ORDER_SERVICE_PORT:8081}

# Order DB. Regla arquitectonica 3: order-service recibe UNICAMENTE la URL de su propia base.
# Variables documentadas en .env.example.
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:${ORDER_DB_HOST_PORT:5433}/${ORDER_DB_NAME:orderdb}}
spring.datasource.username=${ORDER_DB_USER:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:}

# El esquema lo crean los scripts de infrastructure/postgres/order-db/ (HU-002):
# Hibernate solo valida que el mapeo coincida (docs/wiki/03-contratos/persistencia.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Problem Details (RFC 9457) para los errores que no maneja el ControllerAdvice.
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------------------------
#  Health checks (HU-604). Contrato: docs/wiki/03-contratos/api-rest.md
# ---------------------------------------------------------------------------
# Solo se publica health: ningún otro endpoint de Actuator queda expuesto.
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only

# Se muestra el estado por componente (qué dependencia está caída) pero nunca
# su detalle, que es donde Actuator incluiría URL, usuario o versión (CA-3).
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Separa "la aplicación arrancó" (liveness) de "sus dependencias esenciales
# responden" (readiness).
#
# El grupo readiness contiene SOLO readinessState por omisión: un contribuyente
# nuevo NO entra solo. Order Service ya tiene su base (HU-101), así que se incluye
# db; sin esta línea readiness respondería 200 con Order DB caída.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ---------------------------------------------------------------------------
#  Publicación de OrderCreated en orders.events (HU-103).
#  Contrato: docs/wiki/03-contratos/eventos.md
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# CA4. acks=all: el líder espera a todas las réplicas sincronizadas antes de confirmar.
# idempotence=true: un reintento interno del productor no duplica el registro en el tópico.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# La clave es el orderId y el valor va como texto: el envelope se serializa en el
# publicador, que es donde vive el contrato (contracts/events/v1/).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Cuánto se espera a que Kafka confirme antes de darlo por fallido. Sin este límite, una
# publicación tras el commit podría bloquear la respuesta HTTP del pedido ya creado.
spring.kafka.producer.properties.delivery.timeout.ms=${ORDERS_PUBLISH_TIMEOUT_MS:10000}
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000

# Los tópicos se leen de configuración, nunca como literales dispersos (regla 11).
foodflow.kafka.orders-topic=${ORDERS_TOPIC:orders.events}

# ---------------------------------------------------------------------------
#  Consumo de payments.events (HU-104). Contrato: docs/wiki/03-contratos/eventos.md
# ---------------------------------------------------------------------------
# Grupo propio, con el formato <servicio>.<topico> del contrato. Notification Service consume el
# mismo topico en otro grupo: los dos reciben el resultado del pago por separado (D-6).
foodflow.kafka.payments-topic=${PAYMENTS_TOPIC:payments.events}
foodflow.kafka.payments-consumer-group=${ORDER_PAYMENTS_CONSUMER_GROUP:order-service.payments}
spring.kafka.consumer.auto-offset-reset=earliest

# El offset se confirma a mano y solo despues del commit local (ADR-09).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Tolerancia a mensajes corruptos: un valor ilegible no tumba al consumidor.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

# ---------------------------------------------------------------------------
#  Reintentos y DLQ del consumidor (HU-602). Politica de convenciones.md:
#  3 intentos, espera inicial 1 s, multiplicador 2. Un evento no procesable no
#  se reintenta: va directo a <topico>.dlq.
# ---------------------------------------------------------------------------
foodflow.kafka.retry.max-attempts=${KAFKA_RETRY_MAX_ATTEMPTS:3}
foodflow.kafka.retry.initial-interval=${KAFKA_RETRY_INITIAL_INTERVAL:1s}
foodflow.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2}
